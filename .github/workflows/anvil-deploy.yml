# Dispatch this branch to check the CI pool before enabling it on the deployment workflow.
name: Verify Posse runner
run-name: Verify Posse runner ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: triac-ci
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: ./check.sh
