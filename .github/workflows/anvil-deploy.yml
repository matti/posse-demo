# Deploys a candidate to one of the koesivusto's directories (GitHub Pages) and verifies it.
# Started by TRIAC Anvil through workflow_dispatch on the candidate's branch; it finds the run
# again by the correlation id in the run's name, and shows the client the pictures of the
# anvil-pictures artifact when she is asked to accept the batch.
#
# One Pages site holds three directories, one per environment of Anvil's pipeline: `testaaja`
# and `toinen` (each client contact's own) and `yla` (the upstream). A dispatch deploys one of
# them, named by the input `site` (`matti.github.io/posse-demo/<directory>`, as Anvil fills it),
# and leaves the other two as they are: every directory is kept on the branch `gh-pages`, the run
# replaces only its own there, and Pages publishes that branch (its source is "Deploy from a
# branch", gh-pages, the root). The run then waits until the directory serves its commit.
name: Anvil deploy
run-name: Anvil deploy ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        required: true
        type: string
      site:
        description: "matti.github.io/posse-demo/<testaaja|toinen|yla>"
        required: true
        type: string

permissions:
  contents: write

# No concurrency group: GitHub keeps one waiting run per group and cancels the others, so of
# three deploys started together (a contact's directory, the other's, the upstream) the middle
# one was cancelled (23 Nov 2026). Runs go side by side; what they share is the branch gh-pages,
# and the step that pushes it takes the branch anew and tries again when another run was first.

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT: playwright@1.65.1
      SITE: ${{ inputs.site }}
    steps:
      - uses: actions/checkout@v7

      - name: Which directory
        id: directory
        shell: bash
        run: |
          directory="${SITE##*/}"
          case "$directory" in
            testaaja | toinen | yla) ;;
            *) echo "site $SITE is none of testaaja, toinen, yla" >&2; exit 1 ;;
          esac
          echo "name=$directory" >> "$GITHUB_OUTPUT"

      - name: Check
        run: ./check.sh

      - name: Build the pages
        run: python3 -B app.py --build site

      - name: Pictures at a phone width and a desktop width
        shell: bash
        run: |
          npx --yes "$PLAYWRIGHT" install --with-deps chromium
          # The app prints its port once it listens: reading that line is the wait.
          exec 3< <(python3 -B app.py 0)
          read -r port <&3
          mkdir -p shots
          npx --yes "$PLAYWRIGHT" screenshot --full-page --viewport-size "390, 844" \
            "http://127.0.0.1:$port/" shots/etusivu-puhelin.png
          npx --yes "$PLAYWRIGHT" screenshot --full-page --viewport-size "1440, 900" \
            "http://127.0.0.1:$port/" shots/etusivu-tietokone.png

      - uses: actions/upload-artifact@v7
        with:
          name: anvil-pictures
          path: shots/
          if-no-files-found: error

      - name: Replace this directory on gh-pages, keep the others
        shell: bash
        env:
          DIRECTORY: ${{ steps.directory.outputs.name }}
        run: |
          set -euo pipefail
          # Another run may push between the fetch and the push: then the branch is taken anew
          # and this directory replaced on it again. Five tries; each is a real conflict lost.
          for attempt in 1 2 3 4 5; do
            rm -rf pages && git worktree prune
            if git fetch --depth 1 origin gh-pages; then
              git worktree add --detach pages FETCH_HEAD
            else
              # The first deploy: a branch of its own history, holding only the pages.
              git worktree add --orphan -b "gh-pages-$GITHUB_RUN_ID-$attempt" pages
            fi
            rm -rf "pages/$DIRECTORY"
            cp -R site "pages/$DIRECTORY"
            # The site's own address leads to the upstream; no word of its own.
            printf '<!doctype html>\n<meta http-equiv="refresh" content="0; url=yla/">\n' > pages/index.html
            touch pages/.nojekyll
            git -C pages add -A
            git -C pages -c user.name="Anvil deploy" -c user.email="anvil-deploy@users.noreply.github.com" \
              commit -q --allow-empty -m "Deploy $GITHUB_SHA to $DIRECTORY"
            if git -C pages push -q origin HEAD:refs/heads/gh-pages; then
              exit 0
            fi
            echo "gh-pages moved under this run (try $attempt); taking it anew"
          done
          echo "gh-pages could not be pushed in five tries" >&2
          exit 1

      # Pages publishes the branch gh-pages (Settings, Pages, "Deploy from a branch"): the push
      # above is the deploy. Not actions/deploy-pages: it names a deployment by the run's commit,
      # and Pages answers "success" to a second deployment of a commit without publishing it, so
      # the upstream never got the very commit a contact's directory already held (23 Nov 2026).
      - name: Verify the directory serves this commit
        run: python3 -B verify.py "https://$SITE/" "$GITHUB_SHA"
